[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshguard-sim"
version = "0.1.0"
description = "Offline mesh networking simulation for anonymous rescue beacons"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
meshguard-sim = "meshguard_sim.__main__:main"

[tool.setuptools]
packages = ["meshguard_sim"]
